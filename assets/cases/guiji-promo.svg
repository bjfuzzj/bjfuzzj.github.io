    <circle cx="804" cy="186" r="8" fill="#c6f36a"/><circle cx="832" cy="186" r="8" fill="#9caf9f"/><circle cx="860" cy="186" r="8" fill="#bdc9bf"/>
    <rect x="900" y="176" width="184" height="20" rx="10" fill="#cbd8cf"/>
